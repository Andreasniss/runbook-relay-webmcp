name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Verify reusable skill behavior
        run: python3 -m unittest discover -s skills/evidence-sdlc/tests -v
      - name: Check public repository privacy
        env:
          PRIVACY_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          PRIVACY_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python3 scripts/test_privacy.py
          if [ -n "$PRIVACY_BASE" ]; then
            python3 scripts/check_privacy.py --range "$PRIVACY_BASE" "$PRIVACY_HEAD"
          else
            python3 scripts/check_privacy.py --head
          fi
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run eval:validate
      - run: npm test
